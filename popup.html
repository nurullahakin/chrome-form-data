<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Chrome Form Data</title>
    <link
        rel="stylesheet"
        href="popup.css"
    >
</head>

<body>
    <div class="container">
        <div id="status"></div>
        
        <div id="formDataContainer">
            <!-- Saved forms table or scan results will appear here -->
        </div>
        
        <div id="saveSection" style="display: none;">
            <button id="saveBtn" class="action-btn save-btn">Save Form Data</button>
            <button id="cancelBtn" class="action-btn cancel-btn">Cancel</button>
        </div>
        
        <div class="bottom-actions">
            <button id="scanBtn" class="scan-btn">Scan Current Page</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
