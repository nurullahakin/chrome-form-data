<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Chrome Form Data</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="tailwindcss-4.3.3.js"></script>
</head>

<body class="m-0 h-[600px] w-[800px] overflow-hidden [font-family:Arial,sans-serif]">
    <div class="box-border h-full w-full overflow-x-hidden overflow-y-auto p-2">
        <div id="status" class="hidden"></div>
        
        <div id="formDataContainer">
            <!-- Saved forms table or scan results will appear here -->
        </div>
        
        <div id="saveSection" class="hidden text-left">
            <button id="cancelBtn" class="action-btn cancel-btn inline-block cursor-pointer rounded-[4px] border-0 bg-gray-500 px-4 py-2.5 text-sm font-bold text-white hover:bg-gray-600">Cancel</button>
        </div>
        
        <div class="bottom-actions mt-3 text-left flex gap-2">
            <button id="scanBtn" class="scan-btn cursor-pointer rounded-[4px] border-0 bg-green-600 px-3 py-1.5 text-xs font-bold text-white hover:bg-green-700">Scan Current Page</button>
            <button id="exportBtn" class="cursor-pointer rounded-[4px] border border-gray-300 bg-white px-3 py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-100">Export</button>
            <button id="importBtn" class="cursor-pointer rounded-[4px] border border-gray-300 bg-white px-3 py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-100">Import</button>
            <input type="file" id="importFile" accept="application/json,.json" class="hidden">
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
