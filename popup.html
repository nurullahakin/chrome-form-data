<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Chrome Form Data</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="tailwindcss-4.3.3.js"></script>
</head>

<body class="m-0 h-[600px] w-[800px] overflow-hidden [font-family:Arial,sans-serif]">
    <div class="box-border h-full w-full overflow-x-hidden overflow-y-auto px-5 pb-5 pt-2.5">
        <div id="status" class="hidden"></div>
        
        <div id="formDataContainer" class="mt-[15px]">
            <!-- Saved forms table or scan results will appear here -->
        </div>
        
        <div id="saveSection" class="hidden text-left">
            <button id="saveBtn" class="action-btn save-btn my-2.5 mr-2.5 inline-block cursor-pointer rounded-[4px] border-0 bg-sky-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-sky-700">Save Form Data</button>
            <button id="cancelBtn" class="action-btn cancel-btn my-2.5 inline-block cursor-pointer rounded-[4px] border-0 bg-gray-500 px-4 py-2.5 text-sm font-bold text-white hover:bg-gray-600">Cancel</button>
        </div>
        
        <div class="bottom-actions mt-[15px] pt-2.5 text-center">
            <button id="scanBtn" class="scan-btn cursor-pointer rounded-[4px] border-0 bg-green-600 px-4 py-2 text-[13px] font-bold text-white hover:bg-green-700">Scan Current Page</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
